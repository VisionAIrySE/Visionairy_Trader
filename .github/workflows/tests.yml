name: Research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research replay and storage checks
        run: python -m unittest discover -s research -p "test_*.py" -v
      - name: Sizing arithmetic checks
        run: python -m unittest discover -s sizing -p "test_*.py" -v

